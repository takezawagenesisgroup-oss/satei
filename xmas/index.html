<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>クリスマスプレゼント 申請</title>
<style>
  :root{
    --night:#0f2a1f; --night2:#173d2c; --red:#c8102e; --red2:#a10d25; --gold:#e8b931; --gold2:#fff3c4;
    --card:#fffdf8; --line:#eadfcb; --text:#2a2320; --sub:#7a6e64; --ok:#1f7a4d; --warn:#c2410c;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;color:var(--text);min-height:100%;
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;font-size:15px}
  body{background:radial-gradient(ellipse at 50% -10%,#2c6b4a 0%,var(--night2) 35%,var(--night) 75%) fixed;background-color:var(--night)}
  button{font-family:inherit;cursor:pointer}
  .hidden{display:none!important}

  /* 雪 */
  #snow{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
  #snow i{position:absolute;top:-12px;color:#fff;opacity:.85;animation:fall linear infinite;font-style:normal}
  @keyframes fall{to{transform:translate(var(--dx),110vh) rotate(360deg)}}
  /* 電飾 */
  .lights{position:relative;height:22px;overflow:hidden;white-space:nowrap;font-size:0;text-align:center;margin:0 -16px}
  .lights:before{content:"";position:absolute;left:0;right:0;top:4px;height:2px;background:#2b2b2b;border-radius:50%}
  .lights b{display:inline-block;width:9px;height:13px;border-radius:50%;margin:5px 9px 0;animation:blink 1.6s infinite}
  .lights b:nth-child(4n+1){background:#ff4d4d;box-shadow:0 0 8px #ff4d4d}
  .lights b:nth-child(4n+2){background:#ffd23f;box-shadow:0 0 8px #ffd23f;animation-delay:.4s}
  .lights b:nth-child(4n+3){background:#4dd2ff;box-shadow:0 0 8px #4dd2ff;animation-delay:.8s}
  .lights b:nth-child(4n){background:#6dff8a;box-shadow:0 0 8px #6dff8a;animation-delay:1.2s}
  @keyframes blink{50%{opacity:.35;box-shadow:none}}

  .wrap{position:relative;z-index:1;max-width:560px;margin:0 auto}
  .hero{text-align:center;color:#fff;padding:8px 16px 4px}
  .hero h1{font-size:22px;margin:10px 0 2px;letter-spacing:.04em;text-shadow:0 2px 8px rgba(0,0,0,.4)}
  .hero h1 .y{color:var(--gold)}
  .hero p{font-size:13px;opacity:.85;margin:4px 0 0}
  .demo{background:#fff4e5;border:1px solid #f5c98a;color:#8a4b00;font-size:12px;border-radius:8px;padding:8px 10px;margin:10px 12px 0}
  .adminLink{display:block;width:max-content;margin:-8px auto 28px;color:rgba(255,255,255,.7);font-size:12px;text-decoration:none;border:1px solid rgba(255,255,255,.3);border-radius:14px;padding:5px 12px}
  .closed{background:#fff;border-radius:14px;margin:16px 12px;padding:20px;text-align:center;font-weight:700}

  /* ① 名前 */
  .panel{background:var(--card);border-radius:18px;margin:14px 12px 24px;padding:14px 14px 18px;box-shadow:0 8px 30px rgba(0,0,0,.3);border-top:5px solid var(--red)}
  .panel h2{font-size:15px;margin:2px 0 10px;color:var(--red2)}
  .stabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
  .stabs::-webkit-scrollbar{display:none}
  .stab{flex:1 0 auto;border:1px solid var(--line);background:#fff;border-radius:20px;padding:8px 12px;font-size:13px;font-weight:700;color:var(--sub)}
  .stab.on{background:var(--red);border-color:var(--red);color:#fff}
  .names{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
  .nm{border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px 10px;text-align:left;font-size:15px;font-weight:700;color:var(--text)}
  .nm small{display:block;font-size:11px;color:var(--sub);font-weight:500;margin-top:2px}
  .nm .st{float:right;font-size:10px;border-radius:8px;padding:1px 6px;font-weight:700}
  .nm .st.p{background:#fdeee3;color:var(--warn)}
  .nm .st.d{background:#e1f4ea;color:var(--ok)}

  /* ② 選ぶ */
  #shop header{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,var(--night) 0%,var(--night2) 100%);color:#fff;padding:10px 14px 12px;box-shadow:0 4px 14px rgba(0,0,0,.35)}
  .who{display:flex;justify-content:space-between;align-items:center;font-size:13px}
  .who b{font-size:15px}
  .who button{background:transparent;border:1px solid rgba(255,255,255,.45);color:#fff;border-radius:14px;font-size:11px;padding:4px 10px}
  .ranks{display:flex;gap:6px;margin-top:10px}
  .rk{flex:1;border:0;border-radius:12px;padding:8px 6px;background:rgba(255,255,255,.12);color:#dfe9e3;font-weight:700;font-size:14px;line-height:1.25}
  .rk small{display:block;font-size:11px;font-weight:500;opacity:.9}
  .rk.on{background:var(--red);color:#fff;box-shadow:0 0 0 2px var(--gold) inset}
  .meter{margin-top:10px;background:rgba(255,255,255,.08);border-radius:12px;padding:8px 12px}
  .mrow{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;opacity:.95}
  .left{font-size:26px;font-weight:800;color:var(--gold);letter-spacing:.02em}
  .left.zero{color:#7dffa8}
  .mbar{height:8px;background:rgba(255,255,255,.18);border-radius:4px;overflow:hidden;margin-top:6px}
  .mbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),#ff7a59);transition:width .3s}
  .rnote{background:#fff7e0;color:#7a5200;border-radius:10px;font-size:12px;padding:8px 10px;margin:10px 12px 0;line-height:1.6}
  .rnote button{border:1px solid #e2c27a;background:#fff;border-radius:8px;font-size:12px;padding:4px 8px;margin-top:6px;color:#7a5200}
  .views{display:flex;margin:12px 12px 0;background:rgba(255,255,255,.12);border-radius:12px;padding:3px}
  .vw{flex:1;border:0;background:transparent;color:#dfe9e3;border-radius:10px;padding:8px 4px;font-size:13px;font-weight:700}
  .vw.on{background:#fff;color:var(--night)}
  .fit{display:flex;align-items:center;gap:6px;color:#fff;font-size:12px;margin:8px 14px 0;opacity:.9}
  .fit input{width:18px;height:18px;accent-color:var(--gold)}
  .sec{grid-column:1/-1;color:#fff;font-weight:800;font-size:15px;margin:10px 2px -2px;display:flex;align-items:center;gap:8px}
  .sec:after{content:"";flex:1;height:1px;background:rgba(255,255,255,.3)}
  .shopTag{font-size:10px;color:var(--ok);font-weight:700}
  .cats{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:10px 12px 2px}
  .cats::-webkit-scrollbar{display:none}
  .cat{flex:0 0 auto;border:1px solid rgba(255,255,255,.35);background:transparent;color:#fff;border-radius:16px;padding:6px 12px;font-size:13px}
  .cat.on{background:#fff;color:var(--night);font-weight:700}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px 12px 150px}
  .pz{background:var(--card);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 4px 14px rgba(0,0,0,.25);border:2px solid transparent;transition:border-color .2s}
  .pz.has{border-color:var(--gold)}
  .ph{position:relative;aspect-ratio:4/3;background:#f3ece0;display:flex;align-items:center;justify-content:center;font-size:48px;overflow:hidden}
  .ph img{width:100%;height:100%;object-fit:cover;display:block}
  .ph .q{position:absolute;top:6px;right:6px;background:var(--red);color:#fff;border-radius:12px;font-size:12px;font-weight:800;padding:2px 8px;box-shadow:0 2px 6px rgba(0,0,0,.3)}
  .pinfo{padding:8px 10px 10px;display:flex;flex-direction:column;gap:4px;flex:1}
  .pn{font-size:13px;font-weight:700;line-height:1.35}
  .pnote{font-size:11px;color:var(--sub);line-height:1.4}
  .pp{font-size:17px;font-weight:800;color:var(--red2);margin-top:auto}
  .pp small{font-size:11px;font-weight:600}
  .step{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:4px}
  .step button{width:40px;height:36px;border-radius:10px;border:0;font-size:20px;font-weight:800;line-height:1}
  .step .mi{background:#efe7da;color:var(--text)}
  .step .pl{background:var(--ok);color:#fff}
  .step button:disabled{opacity:.3}
  .step span{font-size:16px;font-weight:800;min-width:24px;text-align:center}
  .over{font-size:10px;color:var(--warn);text-align:center;margin-top:2px;min-height:12px}
  .empty{color:#fff;opacity:.8;text-align:center;grid-column:1/-1;padding:30px 0}

  footer{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:3px solid var(--red);
    padding:10px 12px calc(10px + env(safe-area-inset-bottom));box-shadow:0 -6px 20px rgba(0,0,0,.3)}
  .fin{max-width:560px;margin:0 auto}
  .cart{font-size:12px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:8px}
  .cart b{color:var(--text)}
  .btns{display:flex;gap:8px}
  .btn{border:0;border-radius:12px;padding:13px 14px;font-size:15px;font-weight:800}
  .btn.sub{background:#efe7da;color:var(--text);flex:0 0 auto}
  .btn.main{background:var(--red);color:#fff;flex:1}
  .btn.main:disabled{background:#c9b9b0}
  .btn.green{background:var(--ok);color:#fff;flex:1}

  /* シート */
  .ov{position:fixed;inset:0;background:rgba(10,20,15,.6);display:none;align-items:flex-end;justify-content:center;z-index:50}
  .ov.show{display:flex}
  .sheet{background:var(--card);width:100%;max-width:520px;border-radius:18px 18px 0 0;padding:20px 18px calc(18px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto;border-top:5px solid var(--red)}
  .sheet h2{font-size:18px;margin:0 0 8px}
  .sheet p{font-size:13px;color:var(--sub);margin:6px 0;line-height:1.6}
  .budget{background:linear-gradient(135deg,var(--red),var(--red2));color:#fff;border-radius:14px;text-align:center;padding:16px;margin:12px 0}
  .budget small{display:block;font-size:12px;opacity:.9}
  .budget b{font-size:34px;letter-spacing:.03em}
  .row{display:flex;gap:8px;margin-top:14px}
  .row .btn{flex:1}
  input.code{width:100%;font-size:28px;letter-spacing:.5em;text-align:center;border:2px solid var(--line);border-radius:12px;padding:10px;margin-top:8px;font-family:inherit}
  .bigcode{font-size:44px;font-weight:800;letter-spacing:.3em;text-align:center;color:var(--red2);background:var(--gold2);border-radius:14px;padding:14px 0 14px .3em;margin:12px 0}
  .err{color:var(--red);font-size:13px;font-weight:700;min-height:18px;margin-top:6px}
  .cf{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:10px;background:#fff}
  .cf h3{font-size:14px;margin:0 0 6px;display:flex;justify-content:space-between}
  .cf h3 span{color:var(--red2)}
  .cf ul{margin:0;padding-left:18px;font-size:13px;line-height:1.7}
  .cf .rest{font-size:12px;color:var(--sub);text-align:right}

  /* 完了：サンタ */
  #xmas{position:fixed;inset:0;z-index:80;display:none;overflow:hidden;background:radial-gradient(ellipse at 50% 30%,#1f5a3d 0%,#0b1f16 70%)}
  #xmas.show{display:block}
  .moon{position:absolute;top:8%;right:10%;width:80px;height:80px;border-radius:50%;background:#fff6cf;box-shadow:0 0 40px 10px rgba(255,240,180,.5)}
  .sleigh{position:absolute;top:16%;left:-60%;font-size:44px;white-space:nowrap;animation:fly 4.5s ease-in-out .2s forwards}
  .sleigh:after{content:"✨✨✨";font-size:20px;position:absolute;left:-60px;top:14px;opacity:.9}
  @keyframes fly{0%{left:-60%;transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-30px) rotate(3deg)}100%{left:110%;transform:translateY(10px) rotate(-3deg)}}
  .santa{position:absolute;z-index:2;left:50%;bottom:-260px;transform:translateX(-50%);font-size:150px;line-height:1;animation:pop 1s cubic-bezier(.2,1.4,.4,1) 1.6s forwards;filter:drop-shadow(0 10px 20px rgba(0,0,0,.5))}
  @keyframes pop{to{bottom:8%}}
  .santa .hand{display:inline-block;animation:wave 1s ease-in-out 2.6s infinite;transform-origin:70% 80%}
  @keyframes wave{50%{transform:rotate(-12deg)}}
  .msg{position:absolute;z-index:3;left:0;right:0;top:30%;text-align:center;color:#fff;opacity:0;animation:fade .8s ease 2.4s forwards;padding:0 16px}
  .msg .mc{font-size:40px;font-weight:900;font-family:Georgia,"Times New Roman",serif;font-style:italic;color:var(--gold);text-shadow:0 0 18px rgba(232,185,49,.6),0 3px 0 #7a1020;line-height:1.15}
  .msg .jp{font-size:18px;font-weight:800;margin-top:10px}
  .msg .sm{font-size:13px;opacity:.85;margin-top:6px}
  @keyframes fade{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:scale(1)}}
  .burst{position:absolute;z-index:1;top:-30px;font-size:26px;opacity:.75;animation:drop linear forwards}
  @keyframes drop{to{transform:translateY(115vh) rotate(540deg)}}
  .again{position:absolute;z-index:4;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));transform:translateX(-50%);opacity:0;animation:fade .6s ease 3.6s forwards;background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.4);border-radius:20px;padding:8px 16px;font-size:13px}

  .toast{position:fixed;left:50%;top:16px;transform:translateX(-50%);background:#2a2320;color:#fff;font-size:13px;border-radius:10px;padding:10px 14px;z-index:90;max-width:90%;box-shadow:0 6px 20px rgba(0,0,0,.3)}

  /* ===== 最初のメッセージ（オーナーの思い）。xmas.html と xmas_admin.html で同じ ===== */
  #intro{position:fixed;inset:0;z-index:85;display:none;align-items:center;justify-content:center;overflow:hidden;cursor:pointer;
    background:radial-gradient(ellipse at 50% 40%,#1f5a3d 0%,#0b1f16 75%)}
  #intro.show{display:flex}
  #intro .img{position:absolute;inset:0;background:center/contain no-repeat}
  #intro .mist{position:absolute;inset:-10%;background:radial-gradient(ellipse at 50% 50%,rgba(255,255,255,.9),rgba(230,240,235,.5) 70%);opacity:0}
  #intro .txt{position:relative;z-index:2;color:#fff;text-align:center;padding:0 22px;font-weight:800;font-size:min(21px,5.2vw);line-height:1.9;
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
    text-shadow:0 0 14px rgba(232,185,49,.85),0 2px 6px rgba(0,0,0,.7)}
  #intro .txt span{display:block;opacity:0;transform:translateY(20px) scale(.96);filter:blur(8px);animation:introRise 1.1s ease forwards}
  #intro .txt span.big{font-size:min(25px,5.9vw);white-space:nowrap;color:#ffe08a;margin-top:6px}
  @keyframes introRise{to{opacity:1;transform:none;filter:blur(0)}}
  #intro .tw{position:absolute;z-index:1;opacity:0;animation:introTw 1.6s ease-in-out infinite;pointer-events:none}
  @keyframes introTw{50%{opacity:1;transform:scale(1.35) rotate(15deg)}}
  #intro .sn{position:absolute;top:-10px;color:#fff;opacity:.8;animation:introFall linear infinite;pointer-events:none}
  @keyframes introFall{to{transform:translateY(110vh)}}
  #intro .skip{position:absolute;z-index:3;bottom:calc(16px + env(safe-area-inset-bottom));left:0;right:0;text-align:center;color:rgba(255,255,255,.55);font-size:12px}
  #intro.out{animation:introOut .8s ease forwards}
  @keyframes introOut{to{opacity:0;filter:blur(6px)}}
</style>
</head>
<body>
<div id="snow"></div>

<div class="wrap">
  <!-- ① 名前を選ぶ -->
  <section id="pick">
    <div class="hero">
      <div class="lights" id="lights"></div>
      <h1>🎄 クリスマスプレゼント申請 <span class="y" id="yr"></span></h1>
      <p>自分の名前をタップしてください</p>
    </div>
    <div id="demoBox"></div>
    <div id="closedBox"></div>
    <div class="panel" id="namePanel">
      <h2>🎁 所属をえらぶ</h2>
      <div class="stabs" id="stabs"></div>
      <div class="names" id="names"><p style="grid-column:1/-1;color:var(--sub);font-size:13px">読み込み中…</p></div>
    </div>
    <a id="adminLink" class="adminLink" target="_top" href="#">🔑 管理者の方はこちら</a>
  </section>

  <!-- ② 景品を選ぶ -->
  <section id="shop" class="hidden">
    <header>
      <div class="who"><span>🎅 <b id="meName"></b> さん　<span id="meRole"></span></span><button id="quitBtn">保存して終了</button></div>
      <div class="ranks">
        <button class="rk" data-r="1">第1希望<small id="rk1">のこり</small></button>
        <button class="rk" data-r="2">第2希望（予備）<small id="rk2">のこり</small></button>
      </div>
      <div class="meter">
        <div class="mrow"><span>予算 <b id="mBudget"></b> 円 ／ つかった <b id="mUsed"></b> 円</span><span>のこり</span></div>
        <div class="mrow"><span></span><span class="left" id="mLeft"></span></div>
        <div class="mbar"><i id="mBar"></i></div>
      </div>
    </header>
    <div id="rnote"></div>
    <div class="views" id="views">
      <button class="vw" data-v="shop">🏠 お店別</button><button class="vw" data-v="price">💴 金額別</button><button class="vw" data-v="cat">🎂 種類別</button>
    </div>
    <div class="cats" id="cats"></div>
    <label class="fit"><input type="checkbox" id="fitOnly"> のこりの予算で買えるものだけ表示</label>
    <div class="grid" id="grid"></div>
  </section>
</div>

<footer id="foot" class="hidden">
  <div class="fin">
    <div class="cart" id="cart"></div>
    <div class="btns">
      <button class="btn sub" id="saveBtn">一時保存</button>
      <button class="btn main" id="nextBtn">第2希望へ ▶</button>
    </div>
  </div>
</footer>

<!-- シート（名前確認・再開・保存・確認） -->
<div class="ov" id="ov"><div class="sheet" id="sheet"></div></div>

<div id="intro"></div>

<!-- 完了 -->
<div id="xmas">
  <div class="moon"></div>
  <div class="sleigh">🦌🦌🦌🛷🎅</div>
  <div class="msg">
    <div class="mc">Happy<br>Merry Christmas!</div>
    <div class="jp">申請ありがとうございました 🎁</div>
    <div class="sm" id="doneSub"></div>
  </div>
  <div class="santa"><span class="hand">🎅</span></div>
  <button class="again" id="againBtn">もう一度みる</button>
</div>

<script>window.GENESIS_API="https:\/\/script.google.com\/macros\/s\/AKfycbyRw4l5H-v--p4vjiU2zovgRQ0rf6iMR1B_zH0Hi_WVG84K73gnjPmijcBh0rEjbndy4Q\/exec";</script>
<script>
var IMG={};
const isGAS = typeof google!=="undefined" && google.script && google.script.run;
/* Googleの外（GitHub Pages）に置いた画面では window.GENESIS_API にサーバーのURLが入る（tools/build-static.py）。
   複数のGoogleアカウントにログインした端末でも開けるように、ログイン情報なしで fetch する（サーバー側は doPost） */
const API_URL=(typeof window!=="undefined"&&window.GENESIS_API)||"";
const LIVE=!!isGAS||!!API_URL;
function callApi(fn,args){
  return fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({fn:fn,args:args})})
    .then(r=>r.json()).catch(()=>{throw new Error("サーバーと通信できませんでした。電波の良いところで、もう一度お試しください")})
    .then(d=>{ if(!d||!d.ok) throw new Error(d&&d.error||"エラーが起きました"); return d.result; });
}
function api(fn,...args){
  if(API_URL) return callApi(fn,args);
  if(isGAS) return new Promise((ok,ng)=>google.script.run.withSuccessHandler(ok).withFailureHandler(ng)[fn](...args));
  return new Promise((ok,ng)=>setTimeout(()=>{try{ok(JSON.parse(JSON.stringify(DEMO[fn](...args))))}catch(e){ng(e)}},250));
}
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const yen=n=>Number(n||0).toLocaleString("ja-JP");
const EMOJI={"ケーキ":"🎂","寿司・刺身":"🍣","スイーツ":"🍮","チキン":"🍗","オードブル":"🍱","ドリンク":"🍾","お菓子":"🍬","ピザ":"🍕","寿司":"🍣"};
const emo=c=>EMOJI[c]||"🎁";
function toast(m){const t=document.createElement("div");t.className="toast";t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),3500)}
const errMsg=e=>(e&&e.message)||String(e);

/* 雪と電飾 */
(()=>{const s=$("snow");for(let i=0;i<40;i++){const f=document.createElement("i");f.textContent=Math.random()<.5?"❄":"•";

/* ==================== 状態 ==================== */
let INFO=null, curStore=null, me=null, CODE=null, rank=1, view="shop", cat="すべて", cart={1:{},2:{}}, dirty=false;
const prizeById=id=>INFO.prizes.find(p=>p.id===id);
const total=r=>Object.keys(cart[r]).reduce((a,id)=>{const p=prizeById(id);return a+(p?p.price*cart[r][id]:0)},0);
const count=r=>Object.values(cart[r]).reduce((a,b)=>a+b,0);

/* ==================== ① 名前 ==================== */
api("xmasEnter").then(d=>{
  INFO=d; $("yr").textContent=d.year+"年";
  if(!LIVE) $("demoBox").innerHTML=`<div class="demo">試作版です。動きを試せますが、実際にはどこにも送られません。</div>`;

  if(d.open.label) document.querySelector(".hero p").textContent=`自分の名前をタップしてください（締切：${d.open.label}）`;

function openSheet(html){$("sheet").innerHTML=html;$("ov").classList.add("show")}
function closeSheet(){$("ov").classList.remove("show")}
$("ov").onclick=e=>{if(e.target===$("ov")&&!$("ov").dataset.lock)closeSheet()};

function choose(m){
  openSheet(`<h2>${esc(m.name)} さん</h2><p>${esc(curStore)}　${esc(m.role||"")}</p><p style="text-align:center">確認中…</p>`);
  api("xmasStart",m.name).then(r=>{
    const head=`<h2>${esc(m.name)} さん</h2><p>${esc(curStore)}　${esc(m.role||"")}</p>
      <div class="budget"><small>あなたのプレゼント予算</small><b>${yen(m.budget)}</b> 円</div>`;
    if(r.state==="locked"){openSheet(head+`<p><b>申請済みです。</b>変更したいときは管理者に連絡してください。</p><div class="row"><button class="btn sub" onclick="closeSheet()">もどる</button></div>`);return}
    if(r.state==="paused"){
      openSheet(head+`<p>途中まで保存されています。<b>再開パスワード（4桁）</b>を入れてください。</p>
        <input class="code" id="codeIn" inputmode="numeric" maxlength="4" autocomplete="off">
        <div class="err" id="codeErr"></div>
        <div class="row"><button class="btn sub" onclick="closeSheet()">もどる</button><button class="btn main" id="resumeBtn">続きから</button></div>
        <p style="font-size:11px">パスワードを忘れたときは管理者に連絡してください。</p>`);
      $("resumeBtn").onclick=()=>{const c=$("codeIn").value.trim();$("resumeBtn").disabled=true;
        api("xmasResume",m.name,c).then(x=>{start(m,x.draft,x.code)}).catch(e=>{$("codeErr").textContent=errMsg(e);$("resumeBtn").disabled=false})};
      return;
    }
    openSheet(head+`<p>この金額の中で、好きな景品をえらんでください。<br>
      <b>第1希望</b>と、品切れのときの予備の<b>第2希望</b>の2パターンをえらびます。</p>
      <div class="row"><button class="btn sub" onclick="closeSheet()">もどる</button><button class="btn main" id="goBtn">えらびはじめる 🎁</button></div>`);
    $("goBtn").onclick=()=>start(m,{},null);
  }).catch(e=>openSheet(`<p class="err">${esc(errMsg(e))}</p><div class="row"><button class="btn sub" onclick="closeSheet()">もどる</button></div>`));
}

/* ==================== ② 選ぶ ==================== */
function start(m,draft,code){
  me=Object.assign({store:curStore},m); CODE=code;
  cart={1:{},2:{}};
  [1,2].forEach(r=>Object.keys((draft||{})[r]||{}).forEach(id=>{if(prizeById(id))cart[r][id]=Number(draft[r][id])||0}));
  rank=1; view="shop"; cat="すべて"; $("fitOnly").checked=false; dirty=false; closeSheet();
  // 選ぶ画面の前に、オーナーからのメッセージを数秒見せる
  playIntro(INFO.intro,()=>{
    $("pick").classList.add("hidden"); $("shop").classList.remove("hidden"); $("foot").classList.remove("hidden");
    $("meName").textContent=me.name; $("meRole").textContent=me.role||"";
    window.scrollTo(0,0); draw();
  });
}
const BANDS=[[0,1000,"〜999円"],[1000,3000,"1,000〜2,999円"],[3000,5000,"3,000〜4,999円"],[5000,1e9,"5,000円〜"]];
const bandOf=p=>BANDS.find(b=>p.price>=b[0]&&p.price<b[1])[2];
const uniq=a=>a.filter((x,i)=>a.indexOf(x)===i);
/* 表示の切り替え：お店別／金額別／種類別。それぞれで「すべて」なら見出しごとに並べる */
function groupKey(p){return view==="shop"?p.shop:view==="price"?bandOf(p):p.cat}
function cats(){
  if(view==="price") return ["すべて",...BANDS.map(b=>b[2]).filter(l=>INFO.prizes.some(p=>bandOf(p)===l))];
  return ["すべて",...uniq(INFO.prizes.map(groupKey))];
}
const photoOf=p=>p.photo||IMG[p.id]||IMG[String(p.id).split("-")[0]]||"";
function draw(){
  const used=total(rank), left=me.budget-used;
  document.querySelectorAll(".rk").forEach(b=>b.classList.toggle("on",+b.dataset.r===rank));
  $("rk1").textContent=`のこり ${yen(me.budget-total(1))}円`; $("rk2").textContent=`のこり ${yen(me.budget-total(2))}円`;
  $("mBudget").textContent=yen(me.budget); $("mUsed").textContent=yen(used);
  $("mLeft").textContent=yen(left)+" 円"; $("mLeft").classList.toggle("zero",left===0);
  $("mBar").style.width=Math.min(100,used/me.budget*100)+"%";
  $("rnote").innerHTML=rank===2?`<div class="rnote">🎄 <b>第2希望は予備</b>です。第1希望の商品が手に入らなかったときに、こちらから用意します。
    ${count(2)===0&&count(1)>0?`<br><button id="copyBtn">第1希望と同じ内容から始める</button>`:""}</div>`
    :`<div class="rnote">🎁 まずは<b>いちばん欲しい組み合わせ</b>をえらんでください。同じ商品を2つ以上えらんでもOKです。</div>`;
  if($("copyBtn")) $("copyBtn").onclick=()=>{cart[2]=Object.assign({},cart[1]);dirty=true;draw()};
  document.querySelectorAll(".vw").forEach(b=>b.classList.toggle("on",b.dataset.v===view));
  const cs=cats(); if(!cs.includes(cat)) cat="すべて";
  $("cats").innerHTML=cs.map(c=>`<button class="cat ${c===cat?"on":""}" data-c="${esc(c)}">${c==="すべて"||view!=="cat"?esc(c):emo(c)+" "+esc(c)}</button>`).join("");
  const fit=$("fitOnly").checked;
  let list=INFO.prizes.filter(p=>(cat==="すべて"||groupKey(p)===cat)&&(!fit||p.price<=left||cart[rank][p.id]));
  if(view==="price") list=list.slice().sort((a,b)=>a.price-b.price);
  const order=cats().slice(1);
  if(cat==="すべて") list=list.slice().sort((a,b)=>order.indexOf(groupKey(a))-order.indexOf(groupKey(b)));
  let prev=null;
  $("grid").innerHTML=list.length?list.map(p=>{
    const q=cart[rank][p.id]||0, can=p.price<=left, ph=photoOf(p), g=groupKey(p);
    const head=cat==="すべて"&&g!==prev?`<div class="sec">${view==="cat"?emo(g)+" ":""}${esc(g)}</div>`:""; prev=g;
    return head+`<div class="pz ${q?"has":""}">
      <div class="ph">${ph?`<img src="${esc(ph)}" alt="" loading="lazy" onerror="this.replaceWith(document.createTextNode('${emo(p.cat)}'))">`:emo(p.cat)}${q?`<span class="q">×${q}</span>`:""}</div>
      <div class="pinfo">${view!=="shop"?`<div class="shopTag">${esc(p.shop)}</div>`:""}<div class="pn">${esc(p.name)}</div>${p.note?`<div class="pnote">${esc(p.note)}</div>`:""}
        <div class="pp">${yen(p.price)}<small> 円</small></div>
        <div class="step"><button class="mi" data-id="${esc(p.id)}" data-d="-1" ${q?"":"disabled"}>−</button><span>${q}</span><button class="pl" data-id="${esc(p.id)}" data-d="1" ${can?"":"disabled"}>＋</button></div>
        <div class="over">${can?"":"予算が足りません"}</div>
      </div></div>`}).join(""):`<p class="empty">${fit?"のこりの予算で買えるものはありません":"この中に景品はありません"}</p>`;
  const items=Object.keys(cart[rank]).map(id=>{const p=prizeById(id);return p?`${p.name}${cart[rank][id]>1?"×"+cart[rank][id]:""}`:""}).filter(Boolean);
  $("cart").innerHTML=items.length?`第${rank}希望：<b>${esc(items.join("、"))}</b>`:`第${rank}希望：まだ何もえらんでいません`;
  $("nextBtn").textContent=rank===1?"第2希望へ ▶":"申請する 🎅";
  $("nextBtn").disabled=count(rank)===0;
}
document.querySelector(".ranks").onclick=e=>{const b=e.target.closest(".rk");if(!b)return;rank=+b.dataset.r;draw();window.scrollTo(0,0)};
$("cats").onclick=e=>{const b=e.target.closest(".cat");if(!b)return;cat=b.dataset.c;draw()};
$("views").onclick=e=>{const b=e.target.closest(".vw");if(!b)return;view=b.dataset.v;cat="すべて";draw()};
$("fitOnly").onchange=()=>draw();
$("grid").onclick=e=>{const b=e.target.closest("button[data-id]");if(!b||b.disabled)return;
  const id=b.dataset.id, d=+b.dataset.d, p=prizeById(id), q=(cart[rank][id]||0)+d;
  if(d>0&&total(rank)+p.price>me.budget){toast("予算をこえてしまいます");return}
  if(q<=0) delete cart[rank][id]; else cart[rank][id]=q;
  dirty=true; draw();
};
$("nextBtn").onclick=()=>{if(rank===1){rank=2;draw();window.scrollTo(0,0);return} confirmSubmit()};

/* 一時保存 */
function save(){return api("xmasSave",me.name,cart,CODE).then(r=>{CODE=r.code;dirty=false;return r.code})}
function showCode(code,quit){
  $("ov").dataset.lock="1";
  openSheet(`<h2>💾 一時保存しました</h2><p>続きを入力するときは、名前をえらんでこの<b>再開パスワード</b>を入れてください。<br><b>スクリーンショットかメモ</b>をしておいてください。</p>
    <div class="bigcode">${esc(code)}</div>
    <div class="row"><button class="btn sub" id="endBtn">ここで終了</button><button class="btn green" id="contBtn">続ける</button></div>`);
  $("contBtn").onclick=()=>{delete $("ov").dataset.lock;closeSheet()};
  $("endBtn").onclick=()=>{delete $("ov").dataset.lock;closeSheet();backToTop()};
  if(quit) $("contBtn").classList.add("hidden");
}
$("saveBtn").onclick=()=>{const b=$("saveBtn");b.disabled=true;save().then(c=>showCode(c,false)).catch(e=>toast(errMsg(e))).finally(()=>b.disabled=false)};
$("quitBtn").onclick=()=>{
  if(!dirty&&CODE){backToTop();return}
  if(!dirty&&!CODE&&count(1)+count(2)===0){backToTop();return}
  save().then(c=>showCode(c,true)).catch(e=>toast(errMsg(e)));
};
function backToTop(){me=null;CODE=null;dirty=false;$("shop").classList.add("hidden");$("foot").classList.add("hidden");$("pick").classList.remove("hidden");window.scrollTo(0,0)}

/* 申請 */
function block(r){
  const ids=Object.keys(cart[r]), t=total(r);
  return `<div class="cf"><h3>第${r}希望${r===2?"（予備）":""}<span>${yen(t)} 円</span></h3>
    ${ids.length?`<ul>${ids.map(id=>{const p=prizeById(id);return `<li>${esc(p.name)} ${cart[r][id]>1?"×"+cart[r][id]:""}　<small>${yen(p.price*cart[r][id])}円</small></li>`}).join("")}</ul>`:`<p class="err">まだえらんでいません</p>`}
    <div class="rest">のこり ${yen(me.budget-t)} 円</div></div>`;
}
function confirmSubmit(){
  const ok=count(1)>0&&count(2)>0;
  openSheet(`<h2>🎅 この内容で申請しますか？</h2><p>${esc(me.name)} さん（予算 ${yen(me.budget)} 円）</p>${block(1)}${block(2)}
    <p>申請すると変更できなくなります。変更したいときは管理者に連絡してください。</p>
    <div class="err" id="subErr">${ok?"":"第1希望と第2希望の両方をえらんでください"}</div>
    <div class="row"><button class="btn sub" onclick="closeSheet()">もどる</button><button class="btn main" id="doSubmit" ${ok?"":"disabled"}>申請する</button></div>`);
  $("doSubmit").onclick=()=>{const b=$("doSubmit");b.disabled=true;b.textContent="送信中…";
    api("xmasSubmit",me.name,cart,CODE).then(()=>{dirty=false;closeSheet();celebrate()})
      .catch(e=>{$("subErr").textContent=errMsg(e);b.disabled=false;b.textContent="申請する"})};
}

/* ===== 最初のメッセージを流す（xmas.html と xmas_admin.html で同じ） =====
   intro = { text, image(データURL), effect: none|fade|mist, sec }。タップで飛ばせる。終わったら done() */
function playIntro(intro,done){
  const box=document.getElementById("intro"), ms=Math.max(2,Math.min(6,Number(intro&&intro.sec)||5))*1000;
  const text=String(intro&&intro.text||"").trim(), img=intro&&intro.image||"";
  if(!text&&!img){done&&done();return}
  const lines=text?text.split(/\n/).filter(l=>l.trim()):[];
  const e=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  let h=img?`<div class="img" style="background-image:url('${img}')"></div><div class="mist"></div>`:"";
  for(let i=0;i<14;i++) h+=`<i class="sn" style="left:${Math.random()*100}%;font-size:${6+Math.random()*10}px;animation-duration:${4+Math.random()*5}s;animation-delay:${-Math.random()*6}s">❄</i>`;
  for(let i=0;i<8;i++) h+=`<i class="tw" style="left:${8+Math.random()*84}%;top:${10+Math.random()*80}%;font-size:${12+Math.random()*14}px;animation-delay:${Math.random()*1.6}s">✨</i>`;
  const step=Math.min(.45,(ms/1000*.55)/Math.max(1,lines.length));
  h+=`<div class="txt">${lines.map((l,i)=>`<span class="${i===lines.length-1&&lines.length>1?"big":""}" style="animation-delay:${(.25+i*step).toFixed(2)}s">${e(l)}</span>`).join("")}</div>`;
  h+=`<div class="skip">タップで次へ</div>`;
  box.innerHTML=h; box.classList.remove("out"); box.classList.add("show");
  const im=box.querySelector(".img"), mist=box.querySelector(".mist"), base=text?.6:1;
  if(im&&im.animate){
    const o={duration:ms,fill:"forwards",easing:"ease-in"};
    if(intro.effect==="fade") im.animate([{opacity:base},{opacity:base,offset:.3},{opacity:0}],o);
    else if(intro.effect==="mist"){ im.animate([{opacity:base,filter:"blur(0px)"},{opacity:base*.25,filter:"blur(14px)"}],o); mist.animate([{opacity:0},{opacity:.75}],o); }
    else im.style.opacity=base;
  }
  let ended=false;
  const end=()=>{if(ended)return;ended=true;clearTimeout(t);box.classList.add("out");
    setTimeout(()=>{box.classList.remove("show","out");box.innerHTML="";done&&done()},800)};
  const t=setTimeout(end,ms); box.onclick=end;
}
